name: Create Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
      - "v*.*.*-*-*"

jobs:
  verify:
    name: Verify release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Create release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES="docs/releases/${CURRENT_TAG}.md"

          if [ -f "${RELEASE_NOTES}" ]; then
            cp "${RELEASE_NOTES}" CHANGELOG.md
            exit 0
          fi

          {
            echo "## What's Changed"
            echo
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"* %s (%h)" --no-merges
            else
              git log "${CURRENT_TAG}" --pretty=format:"* %s (%h)" --no-merges
            fi
            echo
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
          } > CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
